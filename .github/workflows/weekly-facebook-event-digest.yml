name: Weekly Facebook Event Digest

on:
  schedule:
    - cron: '0 12 * * 5'
  workflow_dispatch:

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Restore Facebook authenticated session
        env:
          FACEBOOK_STORAGE_STATE_B64: ${{ secrets.FACEBOOK_STORAGE_STATE_B64 }}
          FACEBOOK_STORAGE_STATE_PATH: ${{ vars.FACEBOOK_STORAGE_STATE_PATH || 'facebook-storage-state.json' }}
        run: |
          if [ -z "$FACEBOOK_STORAGE_STATE_B64" ]; then
            echo "Missing FACEBOOK_STORAGE_STATE_B64 secret." >&2
            exit 1
          fi
          echo "$FACEBOOK_STORAGE_STATE_B64" | base64 --decode > "$FACEBOOK_STORAGE_STATE_PATH"

      - name: Run scraper
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FACEBOOK_STORAGE_STATE_PATH: ${{ vars.FACEBOOK_STORAGE_STATE_PATH || 'facebook-storage-state.json' }}
          DHAKA_LATITUDE: ${{ vars.DHAKA_LATITUDE || '23.8103' }}
          DHAKA_LONGITUDE: ${{ vars.DHAKA_LONGITUDE || '90.4125' }}
          SEARCH_RADIUS_KM: ${{ vars.SEARCH_RADIUS_KM || '500' }}
          MAX_EVENTS_IN_EMAIL: ${{ vars.MAX_EVENTS_IN_EMAIL || '25' }}
        run: npm run scrape

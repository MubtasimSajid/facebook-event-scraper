name: Weekly Facebook Event Digest

on:
  schedule:
    - cron: "0 12 * * 5"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Firefox
        run: npx playwright install --with-deps firefox

      - name: Run tests
        run: npm test

      - name: Restore Facebook session
        env:
          FACEBOOK_STORAGE_STATE_B64: ${{ secrets.FACEBOOK_STORAGE_STATE_B64 }}
        run: |
          echo "$FACEBOOK_STORAGE_STATE_B64" | base64 --decode > facebook-storage-state.json

      - name: Run scraper
        env:
          FACEBOOK_STORAGE_STATE: facebook-storage-state.json
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAX_EVENTS_IN_EMAIL: 100
        run: npm run scrape

      - name: Remove Facebook session
        if: always()
        run: rm -f facebook-storage-state.json
